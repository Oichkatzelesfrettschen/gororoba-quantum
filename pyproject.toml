# Tool configuration only. The modules run as scripts from gororoba_quantum/ and
# form no installable package; requirements.txt pins the tested runtime.

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["gororoba_quantum"]
# Retained third-party bytes bound by their SHA256SUMS; their replay gates run them.
# A retained Kaggle kernel keeps the bytes the session ran.
extend-exclude = [
    "docs/evidence/reviewer_associator_audit/audit.py",
    "results/kaggle/2026-10-31T012131Z-gororoba-memory-probe-t4/kernel/memory-probe.py",
    "results/kaggle/2026-10-31T075059Z-gororoba-aer-cu13-native/kernel/aer-cu13-native.py",
]

# Quantum Inspire shares these modules with its pinned Python 3.13 interpreter.
[tool.ruff.per-file-target-version]
"scripts/qi_*.py" = "py313"

[tool.ruff.lint]
# S101 bans assert: python -O strips it, so a check must raise explicitly to
# hold in every interpreter mode, and the gates run each command once.
select = ["E", "W", "F", "I", "B", "UP", "S101"]
# PEP 695 `type` aliases evaluate lazily and change runtime use of the aliases.
ignore = ["UP040"]

# Retained evidence and the records they verify pin these files' bytes by
# sha256 (docs/VALIDATION.json, source-closure.json, the ripple validations),
# so their asserts stay as recorded.
[tool.ruff.lint.per-file-ignores]
"gororoba_quantum/rank_path_topology.py" = ["S101"]
"scripts/associator_walsh_classes.py" = ["S101"]
"results/live/folded_raw_analysis.py" = ["S101"]
"results/live/verify_source_closure.py" = ["S101"]
"results/live/2026-10-13T201757.782152Z/ramsey-xy-trajectory-viewer/verify_viewer.py" = ["S101"]
"docs/notes/packages/manual/checks/algebra_interplay.py" = ["S101"]

# The behavioral suite under tests/ (core-615 and core-behavior-NN). Plugin
# autoload is off, so a host's installed plugins never enter a run and xdist,
# the one pinned plugin, loads by name. Each test process writes nothing inside the
# checkout: the cache plugin is off and the gate runs under -B, so the gate
# ledger can trace it; importlib mode imports test modules without placing
# their directories on sys.path.
[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = [
    "--disable-plugin-autoload",
    "-p",
    "xdist.plugin",
    "-p",
    "no:cacheprovider",
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
]
filterwarnings = ["error"]
markers = [
    "audit: replays retained evidence or checks the gate machinery; the scheduled audit runs it and pull requests deselect it",
]

[tool.mypy]
python_version = "3.14"
mypy_path = "gororoba_quantum"
ignore_missing_imports = true
warn_unused_ignores = true
