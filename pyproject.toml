# Tool configuration only. The modules run as scripts from gororoba_quantum/ and
# form no installable package; requirements.txt pins the tested runtime.

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["gororoba_quantum"]
# Retained third-party bytes bound by their SHA256SUMS; their replay gates run them.
extend-exclude = ["docs/evidence/reviewer_associator_audit/audit.py"]

# Quantum Inspire shares these modules with its pinned Python 3.13 interpreter.
[tool.ruff.per-file-target-version]
"scripts/qi_*.py" = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
# PEP 695 `type` aliases evaluate lazily and change runtime use of the aliases.
ignore = ["UP040"]

[tool.mypy]
python_version = "3.14"
mypy_path = "gororoba_quantum"
ignore_missing_imports = true
warn_unused_ignores = true
