# actionlint 1.7.12 predates the generally available hosted Ubuntu 26.04 labels.
# Extend its runner-label catalogue using the supported label configuration.
# GitHub runs ubuntu-26.04 and ubuntu-26.04-arm as hosted runners; the workflow has no self-hosted job.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
