name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            ci/requirements-ci.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r ci/requirements-ci.txt
      - name: Check out open_gororoba for verify.py
        run: git clone --depth 1 https://github.com/Oichkatzelesfrettschen/open_gororoba "$RUNNER_TEMP/open_gororoba"
      - name: Run shard
        env:
          GOROROBA_ROOT: ${{ runner.temp }}/open_gororoba
        run: python ci/run_gates.py --shard ${{ matrix.shard }}/6
