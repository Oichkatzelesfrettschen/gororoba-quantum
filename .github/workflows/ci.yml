name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            ci/requirements-ci.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt -r ci/requirements-ci.txt
          # The retained SymPy evidence ran on mpmath 1.4.1 beside sympy 1.14.0,
          # whose metadata caps mpmath below 1.4; --no-deps reproduces that pair.
          python -m pip install --no-deps mpmath==1.4.1
      - name: Run shard
        run: python ci/run_gates.py --shard ${{ matrix.shard }}/6
