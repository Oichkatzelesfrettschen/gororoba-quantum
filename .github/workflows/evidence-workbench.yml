name: evidence-workbench

# Bounded behavioral tests use constructed fixtures only. The input artifact
# copies existing public bytes; it neither replays acquisitions nor contacts
# a provider. Historical scientific replay remains an on-demand operation.
on:
  pull_request:
    paths:
      - '.github/workflows/evidence-workbench.yml'
      - 'gororoba_quantum/evidence_workbench.py'
      - 'gororoba_quantum/visualizations/evidence_workbench/**'
      - 'scripts/render_evidence_workbench.py'
      - 'scripts/check_evidence_workbench_browser.py'
      - 'tests/gororoba_quantum/test_evidence_workbench.py'
      - 'tests/visualizations/test_evidence_math.cjs'
      - 'tests/visualizations/check_transverse_mle.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-workbench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  behavioral-contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /gororoba_quantum/evidence_workbench.py
            /gororoba_quantum/visualizations/evidence_workbench/
            /scripts/render_evidence_workbench.py
            /tests/gororoba_quantum/test_evidence_workbench.py
            /tests/visualizations/test_evidence_math.cjs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Python and JavaScript contracts
        shell: bash
        run: |
          set -eu
          python --version
          node --version
          python -B -m unittest discover -s tests/gororoba_quantum -p test_evidence_workbench.py
          python -B -O -m unittest discover -s tests/gororoba_quantum -p test_evidence_workbench.py
          node tests/visualizations/test_evidence_math.cjs

  portable-inputs:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            ci
            gororoba_quantum
            results/ripple
            results/live/2026-10-13T025444.603480Z
            results/live/2026-10-13T032011.664435Z
            results/live/2026-10-13T201757.782152Z/ramsey-xy-trajectory-viewer/data
            docs/evidence/ascella-order-coefficients
      - name: Retain input identity
        shell: bash
        run: |
          set -eu
          destination="$RUNNER_TEMP/evidence-workbench-inputs"
          mkdir -p "$destination"
          git rev-parse HEAD > "$destination/COMMIT"
          for file in \
            ci/requirements-ci.txt \
            gororoba_quantum/parallel.py \
            results/ripple/measured-ripple.json \
            results/ripple/measured-rank-sector.json \
            results/ripple/folded-job-review.json \
            results/live/2026-10-13T201757.782152Z/ramsey-xy-trajectory-viewer/data/ramsey_observations.csv \
            results/live/2026-10-13T201757.782152Z/ramsey-xy-trajectory-viewer/data/ramsey_fits_model_dependent.csv \
            docs/evidence/ascella-order-coefficients/fixed-mesh-confirmation.json \
            docs/evidence/ascella-order-coefficients/new-seed-score.json \
            docs/evidence/ascella-order-coefficients/replication-score.json; do
            install -D "$file" "$destination/$file"
          done
          for run in \
            results/live/2026-10-13T025444.603480Z \
            results/live/2026-10-13T032011.664435Z; do
            mkdir -p "$destination/$run"
            cp -a "$run/." "$destination/$run/"
          done
          python3 -m pip download --only-binary=:all: --no-deps \
            "$(grep '^ruff==' ci/requirements-ci.txt)" --dest "$destination/formatter-wheel"
          cd "$destination"
          find results docs ci gororoba_quantum formatter-wheel -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-workbench-inputs
          path: ${{ runner.temp }}/evidence-workbench-inputs
          retention-days: 7
          if-no-files-found: error
