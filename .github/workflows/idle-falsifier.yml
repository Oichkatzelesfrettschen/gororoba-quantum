name: idle-falsifier

# One matrix job per audited run of scripts/local_idle_falsifier.py, each writing that run's part (--parts) on the
# runner's native numeric path, which the part records, and uploading it with the runner's CPU and timing;
# docs/runbooks/idle-falsifier.md assembles the parts into docs/evidence/local_idle_padding/result.json on the
# build host. A push to a
# compute/idle-falsifier/ branch runs the workflow file of the pushed commit, so the sweep needs no merge to main.
# The repository is public, so the logs and artifacts are public too; the sweep reads only files the ref holds.
on:
  push:
    branches:
      - "compute/idle-falsifier/**"
  workflow_dispatch:
    inputs:
      runs:
        description: space-separated run directories under results/live, or all
        required: true
        type: string
        default: all

permissions:
  contents: read

env:
  GLIBC_TUNABLES: glibc.rtld.optional_static_tls=4096
  # The runner's own dispatch and OpenBLAS kernel run uncapped; one BLAS thread keeps a product's reduction order
  # independent of the core count, so an Intel SDE replay of the recorded CPU reproduces it (docs/PYTHON.md).
  OPENBLAS_NUM_THREADS: "1"

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      runs: ${{ steps.runs.outputs.runs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/pins-venv
      - id: runs
        shell: sh
        env:
          RUNS: ${{ inputs.runs || 'all' }}
        run: |
          set -eu
          "$PYTHON" -B -c 'import json, os, sys
          sys.path.insert(0, "scripts")
          import ghost_run
          wanted = os.environ["RUNS"].split()
          runs = ghost_run.audited_runs() if wanted == ["all"] else ["results/live/" + r for r in wanted]
          print("runs=" + json.dumps(runs))' >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/pins-venv
      - name: Falsifier run
        shell: sh
        env:
          RUN: ${{ matrix.run }}
        run: |
          set -eu
          out="$RUNNER_TEMP/parts"
          mkdir -p "$out"
          name=$(basename "$RUN")
          lscpu > "$out/cpu-$name.txt"
          # A four-qubit segmented spectator replica holds about 7 GB in its exact law, so those runs take one
          # worker of the runner's 16 GB; the other runs take two.
          case "$name" in
            2026-10-21T043156.858484Z | 2026-10-21T064222.721454Z) workers=1 ;;
            *) workers=2 ;;
          esac
          GOROROBA_WORKERS=$workers /usr/bin/time -v -o "$out/time-$name.txt" "$PYTHON" -B \
            scripts/local_idle_falsifier.py --runs "$RUN" --parts "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: idle-part-${{ strategy.job-index }}
          path: ${{ runner.temp }}/parts
          if-no-files-found: error
