name: pr

# Pull-request acceptance through ci/pr_checks.sh: Ruff, mypy, the pytest
# regression suite with the audit marker deselected (pyproject.toml), and the
# ci/gates.json gates the pull request's diff reaches within a per-gate seconds
# bound. Every gate, the retained-evidence replays and the ledger run in
# ci.yml's nightly and manual audit. A job or step that reaches its timeout fails.
# workflow_dispatch serves a pull request that GITHUB_TOKEN opened, whose
# pull_request event starts no workflow; check runs attach to the dispatched
# commit, which is that pull request's head.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: "3.14.7"
      - name: Install the pinned Ruff
        run: python3 -m pip install "$(grep '^ruff==' ci/requirements-ci.txt)"
      - name: ruff
        run: sh ci/pr_checks.sh lint

  types:
    name: types
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/pins-venv
      - name: mypy
        timeout-minutes: 4
        run: sh ci/pr_checks.sh types

  tests:
    name: tests
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/pins-venv
      # ci/seed_provenance.py compares the reproduction-seed baseline with main's.
      - name: Fetch main
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # Several times the measured hosted pytest time; the prune point of
      # ci/AGENTS.md (Behavioral suite) sits well inside it.
      - name: pytest
        timeout-minutes: 5
        env:
          TEST_REPORT: ${{ runner.temp }}/pytest-report.xml
        run: sh ci/pr_checks.sh tests
      # Every test's duration, kept per run so the budget of ci/AGENTS.md (Behavioral suite) reads from data.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: pytest-durations
          path: ${{ runner.temp }}/pytest-report.xml
          if-no-files-found: ignore

  gates:
    name: gates
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      REPLAY_VENV: /home/runner/.cache/gororoba-ci/replay-venv
      LEDGER: /home/runner/.cache/gororoba-ci/ledger/gate-ledger.json
      # Gates that run pytest carry the audit's unbounded call time.
      GOROROBA_TEST_CALL_SECONDS: "0"
    steps:
      # The whole history (about 18 MiB packed) gives the merge base with main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: ./.github/actions/pins-venv
      # The audit's merged ledger from main; its read sets add the data files a
      # gate opens without naming them. A miss leaves the static selection;
      # the plan and the run read the same ledger, so both select the same gates.
      - name: Restore the gate ledger
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: ${{ env.LEDGER }}
          key: gate-ledger-${{ github.sha }}
          restore-keys: gate-ledger-
      - name: Plan the historical replay environment
        id: plan
        run: >-
          GATES_LEDGER="$LEDGER" sh ci/pr_checks.sh gates
          --plan "$RUNNER_TEMP/gate-plan.json" --github-output "$GITHUB_OUTPUT"
      # ci.yml's key, so a pull request restores the runtime main's audit saved.
      - name: Restore the recorded compiler runtime
        id: replay-cache
        if: steps.plan.outputs.historical == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: ${{ env.REPLAY_VENV }}
          key: replay-venv-ubuntu-26.04-${{ runner.arch }}-py3.14.7-${{ hashFiles('ci/requirements-replay.txt', 'ci/requirements-ci.txt', 'ci/install_pins.sh', 'ci/patches/**') }}
      - name: Install the recorded compiler runtime
        if: steps.plan.outputs.historical == 'true' && steps.replay-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          "$pythonLocation/bin/python3" -m venv "$REPLAY_VENV"
          PYTHON="$REPLAY_VENV/bin/python" REQUIREMENTS_FILE=ci/requirements-replay.txt sh ci/install_pins.sh
      - name: Use the recorded compiler runtime
        if: steps.plan.outputs.historical == 'true'
        run: echo "REPLAY_PYTHON=$REPLAY_VENV/bin/python" >> "$GITHUB_ENV"
      - name: Affected gates
        timeout-minutes: 20
        run: GATES_LEDGER="$LEDGER" sh ci/pr_checks.sh gates
