name: pr

# Pull-request regression checks of the repository's own code through
# ci/pr_checks.sh: Ruff, mypy and the pytest suite with the audit marker
# deselected (pyproject.toml), its contract suites in a parallel job. The gates of ci/gates.json (record replays,
# digest and source checks, research-script runs) run on demand, and no workflow compiles Rocq.
# A job or step that reaches its timeout fails.
# workflow_dispatch serves a pull request that GITHUB_TOKEN opened, whose
# pull_request event starts no workflow; check runs attach to the dispatched
# commit, which is that pull request's head.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer pull-request push replaces its stale run; a run on main completes, so
# every merged result is checked once.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        # Ruff and mypy read Python files only, so docs/ and results/ come down as their .py files alone: 93 MB of the
        # tree's 10.3 GB. The full checkout took 208 s on these jobs (pull request 1008).
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            !/results/
            /docs/**/*.py
            /results/**/*.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: "3.14.7"
      - name: Install the pinned Ruff
        run: python3 -m pip install "$(grep '^ruff==' ci/requirements-ci.txt)"
      - name: ruff
        run: sh ci/pr_checks.sh lint

  # A job's limit covers its checkout as well as its step: actions/checkout of this tree has taken up to
  # 4 min 21 s on a hosted runner, so each limit below is that time plus the step's own limit, with margin.
  types:
    name: types
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        # Ruff and mypy read Python files only, so docs/ and results/ come down as their .py files alone: 93 MB of the
        # tree's 10.3 GB. The full checkout took 208 s on these jobs (pull request 1008).
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            !/results/
            /docs/**/*.py
            /results/**/*.py
      - uses: ./.github/actions/pins-venv
      - name: mypy
        timeout-minutes: 4
        run: sh ci/pr_checks.sh types

  # The suite runs in two shards, tests/scripts and the rest, each about half of its test time; the `tests` job
  # below passes only when both shards pass, so the required check keeps its name.
  tests-shard:
    name: tests (${{ matrix.shard }})
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [core, scripts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        # The A5 bulk files no test reads (about 3.3 GB: products tables, normal forms, W8 N = 16 export tables, Azure
        # archive parts; ci/AGENTS.md, "Layout and gates") stay unfetched; checkout took about 200 s of each job.
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/evidence/a5-exceptional-fibers/**/sq.txt
            !/docs/evidence/a5-exceptional-fibers/**/sq.txt.part*
            !/docs/evidence/a5-exceptional-fibers/**/nf-d[0-9].txt
            !/docs/evidence/a5-exceptional-fibers/**/nf-d[0-9].txt.part*
            !/docs/evidence/a5-exceptional-fibers/**/nf[0-9].txt
            !/docs/evidence/a5-exceptional-fibers/**/nf[0-9].txt.part*
            !/docs/evidence/a5-exceptional-fibers/**/s[0-9]_nf[0-9].txt
            !/docs/evidence/a5-exceptional-fibers/working/exports/*/q[BM]*.txt
            !/docs/evidence/a5-exceptional-fibers/working/exports/*/q[BM]*.txt.part*
            !/docs/evidence/a5-exceptional-fibers/working/exports/*/s.txt
            !/docs/evidence/a5-exceptional-fibers/working/azure-results/**/*.tgz.part*
      - uses: ./.github/actions/pins-venv
      # ci/seed_provenance.py compares the reproduction-seed baseline with main's.
      - name: Fetch main
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # Runners of this label differ in per-core speed by up to twice (pull request 1007); the profile names the CPU
      # in the job summary and exports the calibration that scales the per-test budget of tests/conftest.py.
      - name: Runner profile
        run: '"$PYTHON" ci/runner_profile.py --json "$RUNNER_TEMP/runner-profile.json" --github-env'
      # The xdist workers otherwise each compile every imported module from source under -B; precompiling once
      # took 2.1 s and saved 6.2 s of the 232 s tests/scripts run in one job (pull request 1007).
      - name: Precompile bytecode
        run: '"$PYTHON" -m compileall -q -j 0 gororoba_quantum scripts ci tests > /dev/null'
      # The whole suite took 242 to 346 s on 4-CPU runners and 483 s on the slowest (pull request 1007), so each
      # shard takes about half of that and the limit leaves room for the slowest runner.
      - name: pytest
        timeout-minutes: 8
        env:
          TEST_REPORT: ${{ runner.temp }}/pytest-report.xml
          TEST_SHARD: ${{ matrix.shard }}
        run: sh ci/pr_checks.sh tests
      # Every test's duration, kept per run so the budget of ci/AGENTS.md (Behavioral suite) reads from data.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: pytest-durations-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/pytest-report.xml
            ${{ runner.temp }}/runner-profile.json
          if-no-files-found: ignore

  tests:
    name: tests
    needs: tests-shard
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Both shards passed
        env:
          RESULT: ${{ needs.tests-shard.result }}
        run: test "$RESULT" = success

  contracts:
    name: contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        # The A5 bulk files no test reads (about 3.3 GB: products tables, normal forms, W8 N = 16 export tables, Azure
        # archive parts; ci/AGENTS.md, "Layout and gates") stay unfetched; checkout took about 200 s of each job.
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/evidence/a5-exceptional-fibers/**/sq.txt
            !/docs/evidence/a5-exceptional-fibers/**/sq.txt.part*
            !/docs/evidence/a5-exceptional-fibers/**/nf-d[0-9].txt
            !/docs/evidence/a5-exceptional-fibers/**/nf-d[0-9].txt.part*
            !/docs/evidence/a5-exceptional-fibers/**/nf[0-9].txt
            !/docs/evidence/a5-exceptional-fibers/**/nf[0-9].txt.part*
            !/docs/evidence/a5-exceptional-fibers/**/s[0-9]_nf[0-9].txt
            !/docs/evidence/a5-exceptional-fibers/working/exports/*/q[BM]*.txt
            !/docs/evidence/a5-exceptional-fibers/working/exports/*/q[BM]*.txt.part*
            !/docs/evidence/a5-exceptional-fibers/working/exports/*/s.txt
            !/docs/evidence/a5-exceptional-fibers/working/azure-results/**/*.tgz.part*
      - uses: ./.github/actions/pins-venv
      # The per-test budget scales by this runner's speed factor, as in the test shards.
      - name: Runner profile
        run: '"$PYTHON" ci/runner_profile.py --github-env'
      - name: pytest
        timeout-minutes: 5
        env:
          TEST_REPORT: ${{ runner.temp }}/pytest-report.xml
        run: sh ci/pr_checks.sh contracts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: pytest-durations-contracts
          path: ${{ runner.temp }}/pytest-report.xml
          if-no-files-found: ignore

  # The same tests and contract suites on arm64: Linux with OpenBLAS and macOS with Accelerate, two numeric
  # identities apart from the x64 runners (docs/design/native-numeric-replay.md). A test whose result depends on
  # the platform carries a strict expected failure from tests/platform_expectations.py.
  arm:
    name: arm (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04-arm, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        # The A5 bulk files no test reads (about 3.3 GB: products tables, normal forms, W8 N = 16 export tables, Azure
        # archive parts; ci/AGENTS.md, "Layout and gates") stay unfetched; checkout took about 200 s of each job.
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/evidence/a5-exceptional-fibers/**/sq.txt
            !/docs/evidence/a5-exceptional-fibers/**/sq.txt.part*
            !/docs/evidence/a5-exceptional-fibers/**/nf-d[0-9].txt
            !/docs/evidence/a5-exceptional-fibers/**/nf-d[0-9].txt.part*
            !/docs/evidence/a5-exceptional-fibers/**/nf[0-9].txt
            !/docs/evidence/a5-exceptional-fibers/**/nf[0-9].txt.part*
            !/docs/evidence/a5-exceptional-fibers/**/s[0-9]_nf[0-9].txt
            !/docs/evidence/a5-exceptional-fibers/working/exports/*/q[BM]*.txt
            !/docs/evidence/a5-exceptional-fibers/working/exports/*/q[BM]*.txt.part*
            !/docs/evidence/a5-exceptional-fibers/working/exports/*/s.txt
            !/docs/evidence/a5-exceptional-fibers/working/azure-results/**/*.tgz.part*
      - uses: ./.github/actions/pins-venv
      - name: Runner profile
        run: '"$PYTHON" ci/runner_profile.py --github-env'
      # ci/pr_checks.sh holds its shared lock with flock, and the scripts under test call GNU timeout and the GNU
      # forms of the coreutils; macOS ships neither, so Homebrew's flock and coreutils supply them. gnubin joins
      # PATH after pins-venv, because setup-python's macOS installer needs the BSD chmod. The macOS arm64 runner reads
      # the repository about twice as slowly as the Linux runners (its slowest calls took 35.6 s), so its call-budget
      # target (tests/conftest.py) is 30 s, failing a call past 45 s; the x64 and Linux arm64 jobs keep the 10 s
      # target that catches a slowdown.
      - name: Install flock and GNU coreutils
        if: runner.os == 'macOS'
        run: |
          brew install flock coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "GOROROBA_TEST_CALL_SECONDS=30" >> "$GITHUB_ENV"
      - name: Fetch main
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - name: pytest
        timeout-minutes: 10
        env:
          TEST_REPORT: ${{ runner.temp }}/pytest-report.xml
        run: sh ci/pr_checks.sh tests
      - name: contract suites
        timeout-minutes: 6
        run: sh ci/pr_checks.sh contracts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: pytest-durations-${{ matrix.runner }}
          path: ${{ runner.temp }}/pytest-report.xml
          if-no-files-found: ignore
