name: pr

# Pull-request regression checks of the repository's own code through
# ci/pr_checks.sh: Ruff, mypy and the pytest suite with the audit marker
# deselected (pyproject.toml), its contract suites in a parallel job. The gates of ci/gates.json (record replays,
# digest and source checks, research-script runs) run on demand, and
# proofs.yml compiles a proof change. A job or step that reaches its timeout fails.
# workflow_dispatch serves a pull request that GITHUB_TOKEN opened, whose
# pull_request event starts no workflow; check runs attach to the dispatched
# commit, which is that pull request's head.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer pull-request push replaces its stale run; a run on main completes, so
# every merged result is checked once.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: "3.14.7"
      - name: Install the pinned Ruff
        run: python3 -m pip install "$(grep '^ruff==' ci/requirements-ci.txt)"
      - name: ruff
        run: sh ci/pr_checks.sh lint

  # A job's limit covers its checkout as well as its step: actions/checkout of this tree has taken up to
  # 4 min 21 s on a hosted runner, so each limit below is that time plus the step's own limit, with margin.
  types:
    name: types
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/pins-venv
      - name: mypy
        timeout-minutes: 4
        run: sh ci/pr_checks.sh types

  tests:
    name: tests
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/pins-venv
      # ci/seed_provenance.py compares the reproduction-seed baseline with main's.
      - name: Fetch main
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # Several times the measured hosted pytest time; the prune point of
      # ci/AGENTS.md (Behavioral suite) sits well inside it.
      - name: pytest
        timeout-minutes: 5
        env:
          TEST_REPORT: ${{ runner.temp }}/pytest-report.xml
        run: sh ci/pr_checks.sh tests
      # Every test's duration, kept per run so the budget of ci/AGENTS.md (Behavioral suite) reads from data.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: pytest-durations
          path: ${{ runner.temp }}/pytest-report.xml
          if-no-files-found: ignore

  contracts:
    name: contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/pins-venv
      - name: pytest
        timeout-minutes: 5
        env:
          TEST_REPORT: ${{ runner.temp }}/pytest-report.xml
        run: sh ci/pr_checks.sh contracts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: pytest-durations-contracts
          path: ${{ runner.temp }}/pytest-report.xml
          if-no-files-found: ignore

  # Temporary: rebinds the runner-image ledger after the cap removal and the qiskit 2.6.2 pin, on a hosted runner
  # whose OpenBLAS selects the Haswell core natively (AMD EPYC 7763, no avx512f), the path the ledger's records were
  # written on. Three copies raise the chance of drawing that CPU; a copy on another CPU writes nothing.
  ledger-rebind:
    name: ledger-rebind
    if: github.head_ref == 'deps/pins-match-build-host'
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/pins-venv
      - name: Require a Haswell-core CPU and podman
        id: cpu
        run: |
          model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')
          core=$(GLIBC_TUNABLES=glibc.rtld.optional_static_tls=4096 "$PYTHON" -c "import numpy, threadpoolctl; print(*sorted({i.get('architecture') for i in threadpoolctl.threadpool_info() if i.get('internal_api') == 'openblas'}))")
          avx512=$(grep -c -m1 avx512f /proc/cpuinfo || true)
          echo "cpu=$model openblas=$core avx512f=$avx512 podman=$(podman --version 2>&1)"
          if [ "$core" = Haswell ] && [ "$avx512" = 0 ] && command -v podman >/dev/null; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::copy ${{ matrix.copy }} drew $model (OpenBLAS $core); it writes nothing"
          fi
      - name: Rewrite and bind every ledger record
        if: steps.cpu.outputs.ok == '1'
        timeout-minutes: 140
        run: |
          export GLIBC_TUNABLES=glibc.rtld.optional_static_tls=4096
          sh ci/runner_image_rebind.sh 2>&1 | tee "$RUNNER_TEMP/rebind.log"
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/changed.txt"
          tar czf "$RUNNER_TEMP/rebind.tgz" ci/runner_image_records.json $(awk '{print $2}' "$RUNNER_TEMP/changed.txt" | grep -v '^ci/runner_image_records.json$') 
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: steps.cpu.outputs.ok == '1' && always()
        with:
          name: ledger-rebind-${{ matrix.copy }}
          path: |
            ${{ runner.temp }}/rebind.tgz
            ${{ runner.temp }}/rebind.log
            ${{ runner.temp }}/changed.txt
          if-no-files-found: warn
