name: pr

# Pull-request regression checks of the repository's own code through
# ci/pr_checks.sh: Ruff, mypy and the pytest suite with the audit marker
# deselected (pyproject.toml), its contract suites in a parallel job. The gates of ci/gates.json (record replays,
# digest and source checks, research-script runs) run on demand, and
# proofs.yml compiles a proof change. A job or step that reaches its timeout fails.
# workflow_dispatch serves a pull request that GITHUB_TOKEN opened, whose
# pull_request event starts no workflow; check runs attach to the dispatched
# commit, which is that pull request's head.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer pull-request push replaces its stale run; a run on main completes, so
# every merged result is checked once.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: "3.14.7"
      - name: Install the pinned Ruff
        run: python3 -m pip install "$(grep '^ruff==' ci/requirements-ci.txt)"
      - name: ruff
        run: sh ci/pr_checks.sh lint

  # A job's limit covers its checkout as well as its step: actions/checkout of this tree has taken up to
  # 4 min 21 s on a hosted runner, so each limit below is that time plus the step's own limit, with margin.
  types:
    name: types
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/pins-venv
      - name: mypy
        timeout-minutes: 4
        run: sh ci/pr_checks.sh types

  tests:
    name: tests
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/pins-venv
      # ci/seed_provenance.py compares the reproduction-seed baseline with main's.
      - name: Fetch main
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # Diagnostic: the runner's CPU, and the 576 x 256 design-matrix SVD of
      # scripts/ascella_cz_tomography_case.py under each OpenBLAS kernel.
      - name: Runner CPU and SVD probe
        timeout-minutes: 3
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Hypervisor'
          grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -E 'avx512f|shstk|ibt|amx_tile|avx2|fma' | tr '\n' ' '; echo
          uname -r; ldd --version | head -1; ulimit -s
          py=$HOME/.cache/gororoba-ci/pins-venv/bin/python
          export GLIBC_TUNABLES=glibc.rtld.optional_static_tls=4096 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
          export NPY_DISABLE_CPU_FEATURES="X86_V4 AVX512_ICL AVX512_SPR"
          for core in Haswell Zen SkylakeX Sandybridge Nehalem auto; do
            status=0
            if [ "$core" = auto ]; then unset OPENBLAS_CORETYPE; else export OPENBLAS_CORETYPE=$core; fi
            OPENBLAS_VERBOSE=2 "$py" -X faulthandler -c "import sys; sys.path.insert(0, 'scripts'); import ascella_cz_tomography_case as m; print(m.design_pseudoinverse().shape)" >probe.log 2>&1 || status=$?
            echo "core=$core exit=$status $(grep -m1 '^Core:' probe.log) $(grep -m1 -o 'at +0x[0-9a-f]*' probe.log | tail -1)"
          done
          export OPENBLAS_CORETYPE=Haswell
          "$py" -c "print([l.strip() for l in open('/proc/self/status') if 'x86_Thread' in l])"
          for tun in "glibc.cpu.hwcaps=-SHSTK" "glibc.cpu.x86_shstk=off" "glibc.cpu.hwcaps=-AVX512F"; do
            status=0
            GLIBC_TUNABLES="glibc.rtld.optional_static_tls=4096:$tun" "$py" -X faulthandler -c "import sys; print([l.strip() for l in open('/proc/self/status') if 'x86_Thread' in l]); sys.path.insert(0, 'scripts'); import ascella_cz_tomography_case as m; print(m.design_pseudoinverse().shape)" >probe.log 2>&1 || status=$?
            echo "Haswell with $tun exit=$status $(grep -m1 x86_Thread probe.log)"
          done
          for shape in "576,256" "256,256" "64,64" "2000,300"; do
            status=0
            "$py" -X faulthandler -c "import numpy as np; a = np.random.default_rng(1).normal(size=($shape)); np.linalg.svd(a); print((a.T @ a).shape)" >probe.log 2>&1 || status=$?
            echo "Haswell random svd and gemm shape=$shape exit=$status"
          done
      # Several times the measured hosted pytest time; the prune point of
      # ci/AGENTS.md (Behavioral suite) sits well inside it.
      - name: pytest
        timeout-minutes: 5
        env:
          TEST_REPORT: ${{ runner.temp }}/pytest-report.xml
        run: sh ci/pr_checks.sh tests
      # Every test's duration, kept per run so the budget of ci/AGENTS.md (Behavioral suite) reads from data.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: pytest-durations
          path: ${{ runner.temp }}/pytest-report.xml
          if-no-files-found: ignore

  contracts:
    name: contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/pins-venv
      - name: pytest
        timeout-minutes: 5
        env:
          TEST_REPORT: ${{ runner.temp }}/pytest-report.xml
        run: sh ci/pr_checks.sh contracts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: pytest-durations-contracts
          path: ${{ runner.temp }}/pytest-report.xml
          if-no-files-found: ignore
