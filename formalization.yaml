alignment:
  # Each listed declaration proves the statement beside it; the source names the
  # note or paper whose claim the statement formalizes. The declarations assume
  # nothing from the literature, so literature_dependencies stays empty.
  proved_statements:
    - declaration: basis_mul
      file: proofs/CdTowerBasisSign.v
      statement: "e_a e_b = sigma_k(a, b) e_(a XOR b) in the integer pair tower, sigma_k the cd_sign loop"
      source: docs/evidence/cd-tower-basis-sign/README.md
    - declaration: am_sign
      file: proofs/CdTowerBasisSign.v
      statement: "(-1)^f_k(a, b) = sigma_k(b, a) for the Corollary 4.3 cochain of Albuquerque and Majid"
      source: docs/notes/math-9802116.md
    - declaration: isum_skew
      file: proofs/CdImaginarySumConference.v
      statement: "<x s, y s> = (2^k - 1) <x, y>: right multiplication by the imaginary sum is a skew conference matrix"
      source: docs/notes/topics/cd-star-lattice-tower.md
    - declaration: kernel_equality
      file: proofs/CdAnnihilatorSymmetry.v
      statement: "a z = 0 exactly when z a = 0 for every a, z of the integer pair tower at every level (Corollary 9.3 of math/0511691)"
      source: docs/notes/topics/cd-one-sided-inverses.md
    - declaration: direct_finiteness
      file: proofs/CdAnnihilatorSymmetry.v
      statement: "a b = 1 implies b a = 1 in the integer pair tower at every level"
      source: docs/notes/topics/cd-one-sided-inverses.md
    - declaration: lemma_9_2
      file: proofs/CdAnnihilatorSymmetryReal.v
      statement: "x y = 0, conj(x) y = 0 and x conj(y) = 0 are equivalent in the real pair tower at every level (Lemma 9.2 of math/0511691, through x (conj(x) y) = conj(x) (x y))"
      source: docs/notes/math-0511691.md
    - declaration: kernel_equality
      file: proofs/CdAnnihilatorSymmetryReal.v
      statement: "a z = 0 exactly when z a = 0 for every a, z with real coordinates at every level (Corollary 9.3 of math/0511691)"
      source: docs/notes/topics/cd-one-sided-inverses.md
    - declaration: direct_finiteness
      file: proofs/CdAnnihilatorSymmetryReal.v
      statement: "a b = 1 implies b a = 1 in the real pair tower at every level, with b = conj(a)/<a, a> + w for some w with a w = 0 (right_inverse_form)"
      source: docs/notes/topics/cd-one-sided-inverses.md
    - declaration: lemma_9_5
      file: proofs/CdAnnihilatorSymmetryReal.v
      statement: "x y = 0 with y nonzero at level k + 1 makes x orthogonal to 1 and to the adjoined unit i = (0, 1) (Lemma 9.5 of math/0511691); annihilator_orthogonal states the same for every y annihilated by a nonzero x"
      source: docs/notes/math-0511691.md
    - declaration: flexible
      file: proofs/CdAnnihilatorSymmetryReal.v
      statement: "(x y) x = x (y x) for all x, y with real coordinates at every level (Corollary 2.9 of math/0511691), from flex_sum_zero: x (y z) - (x y) z + z (y x) - (z y) x = 0"
      source: docs/notes/math-0511691.md
    - declaration: ZBridge.kernel_equality
      file: proofs/CdTowerDomainZ.v
      statement: "a z = 0 exactly when z a = 0 in the integer tower of CdImaginarySumConference.v, from the functor CdTower of CdTowerDomain.v over an abstract ordered domain instantiated at Z"
      source: docs/notes/topics/cd-one-sided-inverses.md
    - declaration: ZBridge.lemma_9_5
      file: proofs/CdTowerDomainZ.v
      statement: "x y = 0 with y nonzero at level k + 1 of the integer tower makes x orthogonal to 1 and to the adjoined unit (0, 1) (Lemma 9.5 of math/0511691), through the Z instance of the functor"
      source: docs/notes/math-0511691.md
    - declaration: ZBridge.flexible
      file: proofs/CdTowerDomainZ.v
      statement: "(x y) x = x (y x) in the integer tower at every level (Corollary 2.9 of math/0511691), through the Z instance of the functor"
      source: docs/notes/math-0511691.md
    - declaration: RBridge.kernel_equality
      file: proofs/CdTowerDomainR.v
      statement: "a z = 0 exactly when z a = 0 in the real tower of CdTowerReal.v, from the functor CdTower instantiated at R"
      source: docs/notes/topics/cd-one-sided-inverses.md
    - declaration: RFieldBridge.right_inverse_form
      file: proofs/CdTowerDomainR.v
      statement: "a b = 1 in the real tower implies b = conj(a)/<a, a> + w for some w with a w = 0, from the field extension CdTowerField of CdTowerDomain.v instantiated at R"
      source: docs/notes/topics/cd-one-sided-inverses.md
    - declaration: sign_row_degree_all
      file: proofs/CdSignRowAnf.v
      statement: "Theorem 1: the left sign row of e_m, m != 0, has algebraic degree max(1, k - 1)"
      source: docs/notes/cd_phase_degree.md
    - declaration: right_row_degree
      file: proofs/CdSignRowAnf.v
      statement: "Proposition 4: the right sign row of e_m has degree 1 at a power of two and max(1, bitlen(m) - 2) otherwise"
      source: docs/notes/cd_phase_degree.md
    - declaration: assoc_degree_is
      file: proofs/CdAssociatorAnf.v
      statement: "Theorem 2: the associator phase of distinct nonzero p, q has degree max(1, bitlen(max(p, q)) - 2)"
      source: docs/notes/cd_phase_degree.md
    - declaration: census_degree
      file: proofs/CdAssociatorCensus.v
      statement: "3 2^d (2^(d+1) - 1) unordered basis pairs have associator-phase degree d for 2 <= d <= k - 2, and 21 have degree 1"
      source: docs/notes/cd_phase_degree.md
    - declaration: census_total
      file: proofs/CdAssociatorCensus.v
      statement: "Proposition 5: the point-indicator pair (2^(n-1), 2^(n-1) + 2^(n-2)) has degree n - 2"
      source: docs/notes/cd_phase_degree.md
    - declaration: cd_sign_spec
      file: proofs/CdSignPythonSemantics.v
      statement: "the syntax tree of cd_core.cd_sign returns the tower sign on valid int arguments and raises otherwise"
      source: docs/evidence/cd-sign-python-semantics/README.md
    - declaration: function_semantic_preservation
      file: proofs/CdSignAstTranslation.v
      statement: "the raw serialized source of cd_sign, under an independent interpreter, satisfies the same specification"
      source: docs/evidence/cd-sign-python-translation/README.md
    - declaration: Lv_integer_kernel_trivial
      file: proofs/StiefelWitnessInvertible.v
      statement: "the retained A_6 Stiefel witness has an invertible left-multiplication matrix"
      source: docs/notes/stiefel_generic_invertibility.md
    - declaration: network_2_correct
      file: proofs/TargetFlipN21.v
      statement: "the N = 21 target-flip networks for multipliers 2, 4 and 16 are correct on all 64 packed inputs"
      source: docs/notes/formal_evidence_dependencies.md
    - declaration: average_product_does_not_descend
      file: proofs/FoldAverageDescent.v
      statement: "no operation on averages alone reproduces projected scalar-pair multiplication"
      source: docs/evidence/formal_certificates/README.md
    - declaration: observed_means_exclude_common_binary_channel
      file: proofs/TerminalChannelSeparation.v
      statement: "the observed terminal means exclude a common appended binary channel, in real semantics"
      source: docs/evidence/formal_certificates/README.md

automation:
  methods:
    - method: agent
      models: ["claude-opus-5-5", "claude-fable-5-1"]
      framework: "Claude Code"
      tool_setup: "Rocq 9.3.0 with OCaml 5.5.1 and Stdlib 9.2.0; proofs replayed by each bundle's replay_rocq.sh with -w +all and rocq check"
    - method: manual
  notes: >-
    Commit trailers under proofs/ record Claude Code (claude-opus-5-5) on
    most sources, Claude Code (claude-fable-5-1) on CdAnnihilatorSymmetry.v,
    CdTowerReal.v, CdAnnihilatorSymmetryReal.v, CdTowerDomain.v,
    CdTowerDomainZ.v and CdTowerDomainR.v, and OpenAI ChatGPT on one; the
    owner reviewed and replayed every source.

review:
  status: self-assessed
  notes: >-
    Each bundle retains the compile output under -w +all, the rocq check
    kernel receipt, and the Print Assumptions output of its exported
    theorems; docs/evidence/rocq_kaggle_replay/README.md records an
    independent replay of the formal_certificates, c881_exhaustive,
    stiefel_witness, folding_proofs and TargetFlipN21 bundles on Kaggle.
