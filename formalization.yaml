# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Index of the Rocq proof sources under proofs/ in the mathlib-initiative
# formalization.yaml schema (retained bytes and validation command in
# docs/evidence/formalization-yaml-schema/). Each main result names a selected
# exported declaration, the file that proves it and the theorem-specific
# Print Assumptions list of its receipt; the imported-library kernel context
# is a separate surface described under status, and the statement each
# declaration proves is listed under alignment. The evidence bundle named in
# each note retains the receipts and the replay script. Paths are relative to
# the repository root.
version: "v0.4"

project:
  name: "gororoba-quantum Rocq certificates"
  description: >-
    Kernel-checked Rocq 9.3 proofs about the Cayley-Dickson sign function of
    gororoba_quantum/cd_core.py (basis products, sign-row and associator
    algebraic normal forms, the skew conference property of the imaginary
    sum, the Python semantics of cd_sign), an A_6 Stiefel witness, N = 21
    target-flip networks, and two information-loss certificates.
  authors: ["Oichkatzelesfrettschen (repository owner)"]
  license: "none declared (no LICENSE file; default copyright)"
  responsible_maintainers: ["Oichkatzelesfrettschen"]

sources:
  - title: "Quasialgebra structure of the octonions"
    authors: ["Helena Albuquerque", "Shahn Majid"]
    id: arXiv:math/9802116
    type: article
    relationship: formalizes
    location: docs/notes/math-9802116.md
    note: >-
      Corollary 4.3 cochain recursion and Proposition 4.4(ii), (iii);
      am_sign proves (-1)^f_k(a, b) = sigma_k(b, a) and
      am_octonion_printed_differs records the printed cubic term that
      differs from f_3.
    author_endorsement: not-contacted

  - title: "Algebraic degree of Cayley-Dickson sign rows and associator phases"
    authors: ["gororoba-quantum"]
    id: docs/notes/cd_phase_degree.md
    type: repository note
    relationship: formalizes
    note: >-
      Theorem 1 (sign-row degree), Theorem 2 (associator-phase degree),
      Proposition 4 (right rows), Proposition 5 (point-indicator pairs) and
      the census by degree.

  - title: "Non-associating basis triples along the Cayley-Dickson ladder"
    authors: ["gororoba-quantum"]
    id: docs/notes/topics/cd_associator_defect_census.md
    type: repository note
    relationship: background
    note: "Theorem 5 is the pair law the point-indicator proof formalizes in the degree note's terms."

  - title: "Cayley-Dickson star lattices: Tuna-17 and its lifts"
    authors: ["gororoba-quantum"]
    id: docs/notes/topics/cd-star-lattice-tower.md
    type: repository note
    relationship: formalizes
    note: "The skew conference property of right multiplication by the imaginary sum, for every dimension."

  - title: "One-sided inverses in Cayley-Dickson algebras"
    authors: ["gororoba-quantum"]
    id: docs/notes/topics/cd-one-sided-inverses.md
    type: repository note
    relationship: formalizes
    note: >-
      Lemmas 2 to 4, the kernel-equality theorem and the direct-finiteness
      corollary, on the integer pair tower (CdAnnihilatorSymmetry.v, where
      the affine inverse family is stated in its integer-cleared form
      <a, a> b = conj(a) + w) and on the real pair tower of CdTowerReal.v
      (CdAnnihilatorSymmetryReal.v, with the family conj(a)/<a, a> + w as
      the note states it), and once on the functor CdTowerDomain.v over an
      abstract ordered domain, whose Z and R instances the bridges
      CdTowerDomainZ.v and CdTowerDomainR.v identify with the two towers.

  - title: "Large annihilators in Cayley-Dickson algebras"
    authors: ["Daniel K. Biss", "Daniel Dugger", "Daniel C. Isaksen"]
    id: arXiv:math/0511691
    type: article
    relationship: formalizes
    location: docs/notes/math-0511691.md
    note: >-
      Corollary 9.3 (ker L_x = ker R_x) and the purity Lemma 9.4 (zero
      divisors and annihilated elements are imaginary): on the integer tower through the trace-form adjoint identities of
      Lemma 3.4 (CdAnnihilatorSymmetry.v), and on the real tower through
      Lemma 9.2 itself, with its identity x(x*y) = x*(xy), the mirror
      (xy)y* = (xy*)y and Lemmas 2.6 and 2.8 on real parts
      (CdAnnihilatorSymmetryReal.v), where Lemma 9.5 (a zero divisor and
      its annihilator are orthogonal to C_n = span(1, i_n)) follows by the
      paper's swap (a, b) -> (b, a) and Corollary 2.9 (the flexible law
      (xy)x = x(yx)) by the paper's self-conjugate trilinear sum and
      Lemma 2.8.
    author_endorsement: not-contacted

  - title: "gororoba_quantum/cd_core.py"
    authors: ["gororoba-quantum"]
    id: gororoba_quantum/cd_core.py
    type: source code
    relationship: formalizes
    note: >-
      The cd_sign function is the formalized object: its syntax tree, run
      under a semantics of the Python int subset it uses, returns the tower
      sign and raises on invalid arguments.

  - title: "Generic invertibility of normalized A_6 Stiefel elements"
    authors: ["gororoba-quantum"]
    id: docs/notes/stiefel_generic_invertibility.md
    type: repository note
    relationship: formalizes
    note: "The finite step: the retained integer Stiefel witness of A_6 has an invertible left-multiplication matrix."

  - title: "Constructing zero divisors in the higher dimensional Cayley-Dickson algebras"
    authors: ["Guillermo Moreno"]
    id: arXiv:math/0512517
    type: article
    relationship: background
    location: docs/notes/math-0512517.md
    note: "Section 5 asks whether every Stiefel element is a zero divisor; the witness answers no at A_6."
    author_endorsement: not-contacted

  - title: "Formal evidence dependencies"
    authors: ["gororoba-quantum"]
    id: docs/notes/formal_evidence_dependencies.md
    type: repository note
    relationship: formalizes
    note: >-
      The fold-average descent obstruction, the terminal-channel separation
      in rational and real semantics, and the N = 21 target-flip networks.

related_formalizations:
  - id: https://github.com/Oichkatzelesfrettschen/open_gororoba
    relationship: builds-on
    note: >-
      The folding, C881 and Stiefel bundles under docs/evidence/ replay
      sources of this repository at a pinned commit; its cd_sign_fuel is the
      sign function the Stiefel witness proof evaluates.

status:
  scope: >-
    Selected main-result declarations of twenty proof sources, not every
    exported declaration. Each listed declaration is kernel-checked by rocq
    check on the toolchain of its bundle's toolchain.txt, except
    proofs/TargetFlipN21.v, whose receipt is the compile and check tail in
    docs/evidence/rocq_kaggle_replay/result.json under the toolchain of
    ci/rocq_toolchain.pin. Every axioms list below is the theorem-specific
    Print Assumptions output; sources over nat, Z and Q close with no
    axioms, and the real-valued sources (the terminal-channel certificate
    and the real pair tower with its annihilator theorem) depend on the two
    axioms listed while their full imported-library kernel contexts
    (TerminalChannelSeparationReal.kernel.txt and
    docs/evidence/cd-annihilator-symmetry-real/kernel.txt) also name
    ClassicalDedekindReals.sig_not_dec and Classical_Prop.classic. The
    one-sided inverse theorem of docs/notes/topics/cd-one-sided-inverses.md
    is proved over the integer tower, which covers every rational element by
    clearing denominators, over the real tower, which is the note's
    statement, and once more on the functor CdTowerDomain.v over an abstract
    ordered domain, whose Z instance (CdTowerDomainZ.v) closes with no axiom
    and whose R instance (CdTowerDomainR.v) depends on the two axioms
    listed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - Stdlib.Logic.FunctionalExtensionality.functional_extensionality_dep
    - Stdlib.Reals.ClassicalDedekindReals.sig_forall_dec
  main_results:
    - declaration: basis_mul
      file: proofs/CdTowerBasisSign.v
      axioms: []
    - declaration: am_sign
      file: proofs/CdTowerBasisSign.v
      axioms: []
    - declaration: isum_skew
      file: proofs/CdImaginarySumConference.v
      axioms: []
    - declaration: kernel_equality
      file: proofs/CdAnnihilatorSymmetry.v
      axioms: []
    - declaration: direct_finiteness
      file: proofs/CdAnnihilatorSymmetry.v
      axioms: []
    - declaration: lemma_9_2
      file: proofs/CdAnnihilatorSymmetryReal.v
      axioms:
        - Stdlib.Logic.FunctionalExtensionality.functional_extensionality_dep
        - Stdlib.Reals.ClassicalDedekindReals.sig_forall_dec
    - declaration: kernel_equality
      file: proofs/CdAnnihilatorSymmetryReal.v
      axioms:
        - Stdlib.Logic.FunctionalExtensionality.functional_extensionality_dep
        - Stdlib.Reals.ClassicalDedekindReals.sig_forall_dec
    - declaration: direct_finiteness
      file: proofs/CdAnnihilatorSymmetryReal.v
      axioms:
        - Stdlib.Logic.FunctionalExtensionality.functional_extensionality_dep
        - Stdlib.Reals.ClassicalDedekindReals.sig_forall_dec
    - declaration: lemma_9_5
      file: proofs/CdAnnihilatorSymmetryReal.v
      axioms:
        - Stdlib.Logic.FunctionalExtensionality.functional_extensionality_dep
        - Stdlib.Reals.ClassicalDedekindReals.sig_forall_dec
    - declaration: flexible
      file: proofs/CdAnnihilatorSymmetryReal.v
      axioms:
        - Stdlib.Logic.FunctionalExtensionality.functional_extensionality_dep
        - Stdlib.Reals.ClassicalDedekindReals.sig_forall_dec
    - declaration: ZBridge.kernel_equality
      file: proofs/CdTowerDomainZ.v
      axioms: []
    - declaration: ZBridge.lemma_9_5
      file: proofs/CdTowerDomainZ.v
      axioms: []
    - declaration: ZBridge.flexible
      file: proofs/CdTowerDomainZ.v
      axioms: []
    - declaration: RBridge.kernel_equality
      file: proofs/CdTowerDomainR.v
