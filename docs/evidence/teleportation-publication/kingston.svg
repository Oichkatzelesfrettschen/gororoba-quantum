<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="1440" version="1.1" viewBox="0 0 2560 1440" width="2560"><defs/><rect fill="#061121" height="1440" width="2560" x="0" y="0"/><text fill="#53e4c5" font-family="DejaVu Sans" font-size="22" font-weight="bold" opacity="1" text-anchor="start" x="48" y="64">SEPARATE EXPERIMENT · ENCODED TWO-QUBIT HAMILTONIAN</text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="58" font-weight="bold" opacity="1" text-anchor="start" x="48" y="130">KINGSTON: MEASUREMENT-CONDITIONED ENERGY</text><text fill="#bad2e5" font-family="DejaVu Sans" font-size="25" font-weight="normal" opacity="1" text-anchor="start" x="50" y="166">Quantum energy teleportation (QET)  ·  14 hardware pairs  ·  model settings h = k = 1</text><rect fill="#091b31" height="48" rx="24.0" ry="24.0" stroke="#5bc6ff" stroke-width="1.5" width="399" x="2110" y="45"/><text fill="#5bc6ff" font-family="DejaVu Sans" font-size="17" font-weight="bold" opacity="1" text-anchor="middle" x="2309.5" y="78.12">G O R O R O B A  ·  Q U A N T U M</text><text fill="#91b0ca" font-family="DejaVu Sans" font-size="21" font-weight="bold" opacity="1" text-anchor="end" x="2470" y="144">EVIDENCE  ·  27 OCT 2026</text><rect fill="#10243c" height="664" rx="22" ry="22" stroke="#3c6583" stroke-width="2.2" width="1588" x="44" y="189"/><rect fill="#10243c" height="664" rx="22" ry="22" stroke="#3c6583" stroke-width="2.2" width="860" x="1656" y="189"/><text fill="#f8fbff" font-family="DejaVu Sans" font-size="34" font-weight="bold" opacity="1" text-anchor="start" x="82" y="245">DYNAMIC HARDWARE CONTROL — ALICE AND BOB</text><text fill="#bad2e5" font-family="DejaVu Sans" font-size="22" font-weight="normal" opacity="1" text-anchor="start" x="84" y="283">The mid-circuit result changes a later quantum gate; this is NOT Tuna-17 decoding.</text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="36" font-weight="bold" opacity="1" text-anchor="start" x="105" y="428">A</text><line stroke="#f8fbff" stroke-linecap="round" stroke-width="3.5" x1="160" x2="1545" y1="419" y2="419"/><text fill="#f8fbff" font-family="DejaVu Sans" font-size="36" font-weight="bold" opacity="1" text-anchor="start" x="105" y="621">B</text><line stroke="#f8fbff" stroke-linecap="round" stroke-width="3.5" x1="160" x2="1545" y1="612" y2="612"/><rect fill="#091b31" height="331" rx="12" ry="12" stroke="#5bc6ff" stroke-width="2" width="207" x="195" y="346"/><text fill="#5bc6ff" font-family="DejaVu Sans" font-size="24" font-weight="bold" opacity="1" text-anchor="middle" x="299" y="386">PREPARE</text><text fill="#5bc6ff" font-family="DejaVu Sans" font-size="21" font-weight="bold" opacity="1" text-anchor="middle" x="299" y="417">CORRELATED</text><text fill="#5bc6ff" font-family="DejaVu Sans" font-size="21" font-weight="bold" opacity="1" text-anchor="middle" x="299" y="448">TWO-QUBIT</text><text fill="#5bc6ff" font-family="DejaVu Sans" font-size="21" font-weight="bold" opacity="1" text-anchor="middle" x="299" y="479">STATE</text><circle cx="266" cy="547" fill="#5bc6ff" r="18" stroke="#5bc6ff" stroke-width="2"/><circle cx="333" cy="547" fill="#53e4c5" r="18" stroke="#53e4c5" stroke-width="2"/><path d="M 279,547 Q 300,513 318,547" fill="none" stroke="#bca2ff" stroke-width="4"/><text fill="#bad2e5" font-family="DejaVu Sans" font-size="21" font-weight="normal" opacity="1" text-anchor="middle" x="299" y="655">Ground-state</text><rect fill="#091b31" height="52" rx="7" ry="7" stroke="#5bc6ff" stroke-width="2" width="55" x="489.5" y="393.0"/><text fill="#5bc6ff" font-family="DejaVu Sans" font-size="23" font-weight="bold" opacity="1" text-anchor="middle" x="517" y="428">H</text><rect fill="#091b31" height="48" rx="6" ry="6" stroke="#f8fbff" stroke-width="2" width="46" x="619" y="395"/><path d="M630,427 Q642,405 654,427" fill="none" stroke="#f8fbff" stroke-width="2.8"/><line stroke="#f8fbff" stroke-linecap="round" stroke-width="2.5" x1="642" x2="650" y1="427" y2="414"/><text fill="#5bc6ff" font-family="DejaVu Sans" font-size="22" font-weight="bold" opacity="1" text-anchor="middle" x="590" y="350">ALICE READS X</text><text fill="#bad2e5" font-family="DejaVu Sans" font-size="19" font-weight="normal" opacity="1" text-anchor="middle" x="590" y="375">H + native Z</text><polyline fill="none" points="666,419 746,419 746,505 1158,505 1158,542" stroke="#ffb969" stroke-dasharray="9,9" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/><polygon fill="#ffb969" points="1158,542 1163.85,529.0 1152.15,529.0"/><text fill="#ffb969" font-family="DejaVu Sans" font-size="20" font-weight="bold" id="kingston_classical_bit" text-anchor="start" x="766" xml:space="preserve" y="485"><tspan>classical bit m</tspan><tspan baseline-shift="sub" font-size="15">A</tspan><tspan> selects the sign of RY</tspan></text><rect fill="#091b31" height="160" rx="10" ry="10" stroke="#bca2ff" stroke-width="2.2" width="199" x="834" y="544"/><text fill="#bca2ff" font-family="DejaVu Sans" font-size="19" font-weight="bold" opacity="1" text-anchor="middle" x="933" y="572">PRESET PHASE</text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="32" font-weight="bold" opacity="1" text-anchor="middle" x="933" y="621">Rz(α)</text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="middle" x="933" xml:space="preserve" y="654"><tspan>same for m</tspan><tspan baseline-shift="sub" font-size="12">A</tspan><tspan> = 0, 1</tspan></text><text fill="#bad2e5" font-family="DejaVu Sans" font-size="16" font-weight="normal" opacity="1" text-anchor="middle" x="933" y="678">α pre-calibrated</text><polyline fill="none" points="1035,612 1047,612" stroke="#5bc6ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/><polygon fill="#5bc6ff" points="1047,612 1038.0,607.95 1038.0,616.05"/><rect fill="#091b31" height="160" rx="10" ry="10" stroke="#ffb969" stroke-width="2.2" width="242" x="1050" y="544"/><text fill="#ffb969" font-family="DejaVu Sans" font-size="18" font-weight="bold" opacity="1" text-anchor="middle" x="1171" y="572">FEEDBACK ROTATION</text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="19" font-weight="bold" id="kingston_feedback_m0" text-anchor="start" x="1062" xml:space="preserve" y="616"><tspan>m</tspan><tspan baseline-shift="sub" font-size="14.25">A</tspan><tspan> = 0: RY(−θ*)</tspan></text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="19" font-weight="bold" id="kingston_feedback_m1" text-anchor="start" x="1062" xml:space="preserve" y="650"><tspan>m</tspan><tspan baseline-shift="sub" font-size="14.25">A</tspan><tspan> = 1: RY(+θ*)</tspan></text><text fill="#53e4c5" font-family="DejaVu Sans" font-size="18" font-weight="bold" opacity="1" text-anchor="start" x="1065" y="681">θ* = arctan(1/3)</text><text fill="#bad2e5" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="middle" x="1080" xml:space="preserve" y="730"><tspan>Only RY sign depends on m</tspan><tspan baseline-shift="sub" font-size="13.5">A</tspan><tspan>.  |θ*| = 18.435°.</tspan></text><rect fill="#091b31" height="48" rx="6" ry="6" stroke="#f8fbff" stroke-width="2" width="46" x="1396" y="395"/><path d="M1407,427 Q1419,405 1431,427" fill="none" stroke="#f8fbff" stroke-width="2.8"/><line stroke="#f8fbff" stroke-linecap="round" stroke-width="2.5" x1="1419" x2="1427" y1="427" y2="414"/><text fill="#bad2e5" font-family="DejaVu Sans" font-size="19" font-weight="normal" opacity="1" text-anchor="middle" x="1419" y="370">A re-read</text><rect fill="#091b31" height="52" rx="7" ry="7" stroke="#bca2ff" stroke-width="2" width="68" x="1313.0" y="586.0"/><text fill="#bca2ff" font-family="DejaVu Sans" font-size="23" font-weight="bold" opacity="1" text-anchor="middle" x="1347" y="621">B_B</text><rect fill="#091b31" height="48" rx="6" ry="6" stroke="#f8fbff" stroke-width="2" width="46" x="1465" y="588"/><path d="M1476,620 Q1488,598 1500,620" fill="none" stroke="#f8fbff" stroke-width="2.8"/><line stroke="#f8fbff" stroke-linecap="round" stroke-width="2.5" x1="1488" x2="1496" y1="620" y2="607"/><text fill="#bad2e5" font-family="DejaVu Sans" font-size="18" font-weight="normal" opacity="1" text-anchor="middle" x="1410" y="705">B_B: I for Z_B; H for X_B</text><rect fill="#1e3543" height="73" rx="10" ry="10" stroke="#3c6583" stroke-width="1.3" width="1505" x="84" y="749"/><text fill="#bca2ff" font-family="DejaVu Sans" font-size="27" font-weight="bold" opacity="1" text-anchor="start" x="106" y="781">α</text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="21" font-weight="normal" opacity="1" text-anchor="start" x="138" y="781">is selected PER PAIR before scoring; Rz(α) executes in BOTH if/else branches.</text><text fill="#bad2e5" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start" x="107" xml:space="preserve" y="807"><tspan>Alice is re-measured; the final X</tspan><tspan baseline-shift="sub" font-size="15">A</tspan><tspan>X</tspan><tspan baseline-shift="sub" font-size="15">B</tspan><tspan> estimator does not substitute the earlier bit.</tspan></text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="35" font-weight="bold" opacity="1" text-anchor="start" x="1697" y="244">MEASURED ENDPOINTS</text><rect fill="#12352f" height="231" rx="14" ry="14" stroke="#53e4c5" stroke-width="2.3" width="779" x="1694" y="284"/><text fill="#53e4c5" font-family="DejaVu Sans" font-size="23" font-weight="bold" opacity="1" text-anchor="start" x="1725" y="328">INFORMATION ADVANTAGE</text><text fill="#53e4c5" font-family="DejaVu Sans" font-size="79" font-weight="bold" opacity="1" text-anchor="start" x="1723" y="427" id="kingston_information_mean">+0.107</text><text fill="#bad2e5" font-family="DejaVu Sans" font-size="23" font-weight="normal" opacity="1" text-anchor="start" x="2085" y="383">95% interval</text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="24" font-weight="bold" opacity="1" text-anchor="start" x="2085" y="426" id="kingston_information_interval">+0.093 to +0.121</text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="21" font-weight="normal" opacity="1" text-anchor="start" x="1725" y="478">Beats every record-independent local UNITARY.</text><rect fill="#36222f" height="252" rx="14" ry="14" stroke="#ff7a8a" stroke-width="2.3" width="779" x="1694" y="529"/><text fill="#ff7a8a" font-family="DejaVu Sans" font-size="23" font-weight="bold" opacity="1" text-anchor="start" x="1725" y="572">STRONGER CHANNEL-FLOOR MARGIN</text><rect fill="#4d2530" height="43" rx="21.5" ry="21.5" stroke="#ff7a8a" stroke-width="1.5" width="145" x="2287" y="543"/><text fill="#ff7a8a" font-family="DejaVu Sans" font-size="21" font-weight="bold" opacity="1" text-anchor="middle" x="2359.5" y="572.67">FAILED</text><text fill="#ff7a8a" font-family="DejaVu Sans" font-size="79" font-weight="bold" opacity="1" text-anchor="start" x="1725" y="676" id="kingston_margin_mean">−0.073</text><text fill="#bad2e5" font-family="DejaVu Sans" font-size="23" font-weight="normal" opacity="1" text-anchor="start" x="2085" y="633">95% interval</text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="24" font-weight="bold" opacity="1" text-anchor="start" x="2085" y="677" id="kingston_margin_interval">−0.106 to −0.040</text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="21" font-weight="normal" opacity="1" text-anchor="start" x="1725" y="734">Does not cross the all-channel passivity floor.</text><text fill="#bad2e5" font-family="DejaVu Sans" font-size="19" font-weight="normal" opacity="1" text-anchor="start" x="1700" y="825">18 dynamic circuits  ·  8,192 shots per circuit  ·  one collection</text><rect fill="#10243c" height="509" rx="22" ry="22" stroke="#3c6583" stroke-width="2.2" width="1588" x="44" y="878"/><rect fill="#10243c" height="509" rx="22" ry="22" stroke="#3c6583" stroke-width="2.2" width="860" x="1656" y="878"/><text fill="#f8fbff" font-family="DejaVu Sans" font-size="30" font-weight="bold" opacity="1" text-anchor="start" x="82" y="936">ENCODED ENERGY — FULL MODEL AND OBSERVABLE</text><text fill="#5bc6ff" font-family="DejaVu Sans" font-size="37" font-weight="bold" id="kingston_hamiltonian" text-anchor="start" x="92" xml:space="preserve" y="992"><tspan>H = H</tspan><tspan baseline-shift="sub" font-size="27.75">A</tspan><tspan> + H</tspan><tspan baseline-shift="sub" font-size="27.75">B</tspan><tspan> + V</tspan></text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="30" font-weight="normal" text-anchor="start" x="92" xml:space="preserve" y="1044"><tspan>H</tspan><tspan baseline-shift="sub" font-size="22.5">A</tspan><tspan> = −h Z</tspan><tspan baseline-shift="sub" font-size="22.5">A</tspan><tspan> + h²/r</tspan></text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="30" font-weight="normal" text-anchor="start" x="760" xml:space="preserve" y="1044"><tspan>H</tspan><tspan baseline-shift="sub" font-size="22.5">B</tspan><tspan> = −h Z</tspan><tspan baseline-shift="sub" font-size="22.5">B</tspan><tspan> + h²/r</tspan></text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="30" font-weight="normal" text-anchor="start" x="92" xml:space="preserve" y="1095"><tspan>V = 2k X</tspan><tspan baseline-shift="sub" font-size="22.5">A</tspan><tspan>X</tspan><tspan baseline-shift="sub" font-size="22.5">B</tspan><tspan> + 2k²/r</tspan></text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="30" font-weight="normal" opacity="1" text-anchor="start" x="760" y="1095">r = √(h² + k²)</text><rect fill="#091b31" height="95" rx="12" ry="12" stroke="#3c6583" stroke-width="1.5" width="1477" x="88" y="1134"/><text fill="#53e4c5" font-family="DejaVu Sans" font-size="29" font-weight="bold" text-anchor="start" x="118" xml:space="preserve" y="1174"><tspan>LOCAL QUANTITY  L</tspan><tspan baseline-shift="sub" font-size="21.75">B</tspan><tspan> = ⟨H</tspan><tspan baseline-shift="sub" font-size="21.75">B</tspan><tspan> + V⟩</tspan></text><text fill="#bad2e5" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" x="118" xml:space="preserve" y="1209"><tspan>Estimated using Z</tspan><tspan baseline-shift="sub" font-size="16.5">B</tspan><tspan> and X</tspan><tspan baseline-shift="sub" font-size="16.5">A</tspan><tspan>X</tspan><tspan baseline-shift="sub" font-size="16.5">B</tspan><tspan> measurement settings.</tspan></text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="23" font-weight="normal" id="kingston_info_metric" text-anchor="start" x="91" xml:space="preserve" y="1276"><tspan>Δ</tspan><tspan baseline-shift="sub" font-size="17.25">info</tspan><tspan> = min[L</tspan><tspan baseline-shift="sub" font-size="17.25">B</tspan><tspan> after a record-independent unitary] − L</tspan><tspan baseline-shift="sub" font-size="17.25">B</tspan><tspan>(feedback)</tspan></text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="23" font-weight="normal" id="kingston_floor_metric" text-anchor="start" x="91" xml:space="preserve" y="1323"><tspan>M</tspan><tspan baseline-shift="sub" font-size="17.25">channel</tspan><tspan> = −⟨H</tspan><tspan baseline-shift="sub" font-size="17.25">A</tspan><tspan>⟩</tspan><tspan baseline-shift="sub" font-size="17.25">reference</tspan><tspan> − L</tspan><tspan baseline-shift="sub" font-size="17.25">B</tspan><tspan>(feedback)</tspan></text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="30" font-weight="bold" opacity="1" text-anchor="start" x="1697" y="936">WHAT THE DATA JUSTIFY</text><polyline fill="none" points="1711,997 1718,1006 1735,986" stroke="#53e4c5" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/><text fill="#f8fbff" font-family="DejaVu Sans" font-size="21" font-weight="normal" opacity="1" text-anchor="start" x="1747" y="1006">Feedback outperforms an uninformed unitary.</text><polygon fill="none" points="1721,1044.48 1709.48,1066.08 1732.52,1066.08" stroke="#ff7a8a" stroke-width="2.16"/><text fill="#ff7a8a" font-family="DejaVu Sans" font-size="15" font-weight="bold" opacity="1" text-anchor="middle" x="1721" y="1062.48">!</text><text fill="#f8fbff" font-family="DejaVu Sans" font-size="21" font-weight="normal" opacity="1" text-anchor="start" x="1747" y="1064">It does NOT beat the stronger all-channel floor.</text><circle cx="1721" cy="1115" fill="#5bc6ff" r="5" stroke="none" stroke-width="2"/><text fill="#f8fbff" font-family="DejaVu Sans" font-size="21" font-weight="normal" opacity="1" text-anchor="start" x="1747" y="1122">The prepared reference has additional noise and loss.</text><circle cx="1721" cy="1173" fill="#5bc6ff" r="5" stroke="none" stroke-width="2"/><text fill="#f8fbff" font-family="DejaVu Sans" font-size="21" font-weight="normal" opacity="1" text-anchor="start" x="1747" y="1180">The model assigns dimensionless energy values.</text><circle cx="1721" cy="1231" fill="#5bc6ff" r="5" stroke="none" stroke-width="2"/><text fill="#f8fbff" font-family="DejaVu Sans" font-size="21" font-weight="normal" opacity="1" text-anchor="start" x="1747" y="1238">No electrical power or spacetime transport was measured.</text><circle cx="1721" cy="1289" fill="#5bc6ff" r="5" stroke="none" stroke-width="2"/><text fill="#f8fbff" font-family="DejaVu Sans" font-size="21" font-weight="normal" opacity="1" text-anchor="start" x="1747" y="1296">The result is not state teleportation fidelity.</text><text fill="#91b0ca" font-family="DejaVu Sans" font-size="18" font-weight="normal" opacity="1" text-anchor="start" x="53" y="1424">Sources: gororoba-quantum @ 6721a8b  ·  qet_ladder.py  ·  qet_two_qubit_reference.py  ·  Kingston 2026-10-25 FINDINGS.md</text></svg>